<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>

    //JSON DATA
    const getTodos = (callback) => {
      // the way the request object is created
      const request = new XMLHttpRequest();
      //stages changes
      request.addEventListener("readystatechange", () => {
        //make request then send it and everytime there is a set request then its gonna read that to the console and you can see them in the consoele and they are 4 in total
        // console.log(request,request.readyState);
        if (request.readyState === 4 && request.status === 200) {
          //after all the request stages are successfull you can be able to get the requested which is what we call jsaon data have json strings
          const data=JSON.parse(request.responseText);
          callback(undefined,data)
        }
        //this means if the ready state id 4 but the status is not equal to 200
        else if (request.readyState === 4) {
          console.log("Could not fetch the data!")
        }
      });
      // what we nend to make the request we need 2 things
      // we need the request(GET,PUT,POST) and another argument of the end point
      request.open("GET", "https://jsonplaceholder.typicode.com/todos/?t=" + new Date().getTime());
      // The above we have told our request type is and where is is going to get the data from
      //to send the request
      request.send();

      //HOW DO WE ACCESS THOSE DATA?
      //we first need to pass thorugh the request changes stages which are  4 in totoal

    }
    getTodos((err, data)=>{
      console.log("callback fired");
      if (err) {
        console.log(err);
      }
      else {
        console.log(data)
      }
    });

  </script>
</head>
